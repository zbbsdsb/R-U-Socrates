<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R U Socrates - Social Preview</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            width: 1280px;
            height: 640px;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }
        
        .particles { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
        .particle { position: absolute; width: 4px; height: 4px; background: rgba(139, 92, 246, 0.6); border-radius: 50%; animation: float 8s infinite ease-in-out; }
        .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; top: 80%; animation-delay: 1s; }
        .particle:nth-child(3) { left: 30%; top: 40%; animation-delay: 2s; }
        .particle:nth-child(4) { left: 40%; top: 60%; animation-delay: 3s; }
        .particle:nth-child(5) { left: 50%; top: 30%; animation-delay: 4s; }
        .particle:nth-child(6) { left: 60%; top: 70%; animation-delay: 5s; }
        .particle:nth-child(7) { left: 70%; top: 50%; animation-delay: 6s; }
        .particle:nth-child(8) { left: 80%; top: 20%; animation-delay: 7s; }
        .particle:nth-child(9) { left: 90%; top: 80%; animation-delay: 0.5s; }
        .particle:nth-child(10) { left: 15%; top: 50%; animation-delay: 1.5s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-30px) scale(1.5); opacity: 1; }
        }
        
        .glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .content { position: relative; z-index: 10; text-align: center; max-width: 1000px; }
        .logo-icon { font-size: 64px; margin-bottom: 20px; display: block; }
        
        h1 {
            font-size: 68px;
            font-weight: 700;
            color: white;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }
        
        .subtitle {
            font-size: 26px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 40px;
            font-weight: 400;
        }
        
        .levels { display: flex; justify-content: center; gap: 30px; margin-top: 30px; }
        
        .level {
            background: rgba(255, 255, 255, 0.08);
            padding: 24px 32px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            min-width: 200px;
        }
        
        .level-badge { font-size: 14px; color: #8b5cf6; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; }
        .level-name { font-size: 20px; color: white; font-weight: 600; margin-bottom: 6px; }
        .level-desc { font-size: 14px; color: rgba(255, 255, 255, 0.6); }
        
        .footer {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            z-index: 10;
        }
        
        .company-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .company-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            font-weight: bold;
        }
        
        .company-text { font-size: 16px; color: white; font-weight: 600; }
        .github-link { font-size: 16px; color: rgba(255, 255, 255, 0.7); }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div>
    </div>
    <div class="glow"></div>
    
    <div class="content">
        <span class="logo-icon">👁️</span>
        <h1>R U Socrates</h1>
        <p class="subtitle">The transparent research engine. See how AI thinks.</p>
        
        <div class="levels">
            <div class="level">
                <div class="level-badge">L1</div>
                <div class="level-name">Reasoning Feed</div>
                <div class="level-desc">Live stream of thoughts</div>
            </div>
            <div class="level">
                <div class="level-badge">L2</div>
                <div class="level-name">Reasoning Tree</div>
                <div class="level-desc">Visual exploration paths</div>
            </div>
            <div class="level">
                <div class="level-badge">L3</div>
                <div class="level-name">Score Journey</div>
                <div class="level-desc">Progress over iterations</div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <div class="company-badge">
            <div class="company-icon">O</div>
            <span class="company-text">Oasis Company</span>
        </div>
        <span class="github-link">github.com/zbbsdsb</span>
    </div>
</body>
</html>
