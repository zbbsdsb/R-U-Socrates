# ============================================================
# R U Socrates — Docker Compose (Development)
# ============================================================
# Usage:
#   cp services/.env.example services/.env
#   # edit services/.env with your API keys
#   docker-compose up
#
# Production (standalone):
#   docker build -t ru-socrates .
#   docker run -d -p 3000:3000 -p 8000:8000 \
#     -e DASHSCOPE_API_KEY=sk-... \
#     ru-socrates
# ============================================================

services:
  # ----------------------------------------------------------
  # Frontend — Next.js dev server (hot reload)
  # ----------------------------------------------------------
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install --legacy-peer-deps &&
             npm run dev"
    depends_on:
      - api

  # ----------------------------------------------------------
  # Backend — FastAPI with embedded research pipeline
  # ----------------------------------------------------------
  api:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./services:/app/services
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - ./services/.env
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install -q -r services/requirements.txt 2>/dev/null &&
             uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload"
