# ============================================================
# electron-builder — Windows / macOS / Linux packaging
# ============================================================
# Build installer:  npm run build:electron
# Build unpacked:   npm run build:electron:dir  (faster, no NSIS)
#
# Output: dist/R U Socrates Setup 0.1.0.exe
# ============================================================

appId: com.ru-socrates.app
productName: R U Socrates
copyright: Copyright (c) 2026
artifactName: "${productName}-Setup-${version}.${ext}"

directories:
  output: dist
  buildResources: build

# Include app source; node_modules are handled by electron-builder
files:
  - "**/*"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,changelogs,history}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"

extraMetadata:
  main: electron/main.js

asar: true

win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: "${productName}-${version}-portable.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: R U Socrates

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  category: Development

publish: null
