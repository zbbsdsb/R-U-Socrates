# ============================================================
# electron-builder — Windows / macOS / Linux packaging
# ============================================================
# Build installer:  npm run build:electron
# Build unpacked:   npm run build:electron:dir  (faster, no NSIS)
#
# Output: dist/R U Socrates Setup 0.1.0.exe
# ============================================================

appId: com.ru-socrates.app
productName: R U Socrates
copyright: Copyright (c) 2026
artifactName: "${productName}-Setup-${version}.${ext}"

projectRootDirectory: ../..

directories:
  output: dist
  buildResources: build

# Include Next.js source (dev server is started at runtime by electron main.js)
files:
  - .              # everything except node_modules (handled by npm ci)
  - package.json
  - "!node_modules/.cache"
  - "!node_modules/.next"
  - "!node_modules/@types"
  - "!node_modules/typescript"

extraMetadata:
  main: electron/main.js

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: R U Socrates

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  category: Development

publish: null
